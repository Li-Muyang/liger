defaults:
  - base

# model training
flag_add_input_embedding: True
flag_use_output_embedding: True

embedding_loss_weight: 1
sid_loss_weight: 1

evaluation_method: "dense"

embedding_head_dict:
  normalize_logits: True  # flag_use_output_embedding: True
  logits_temperature: 0.07  # flag_use_output_embedding: True

  text_embedding_dim: 768  # flag_add_input_embedding: True
  hidden_sizes: [256, 512, 768]  # flag_add_input_embedding: True
  embd_proj_dropout_rate: 0.5  # flag_add_input_embedding: True
  embd_proj_in_dropout_rate: 0.2  # flag_add_input_embedding: True
  use_date_context: True  # set True to enable date context feature

use_date_context: True  # top-level flag for date context

# Context projector pre-training
# training_stage: "regular" (no staging), "pretrain_context" (Stage 1), "finetune_with_context" (Stage 2)
training_stage: "regular"
pretrain_context_proj_path: null  # path to Stage 1 output context_proj.pt (for Stage 2)
pretrain_context_proj_config:
  backbone_checkpoint: null  # path to pre-trained backbone checkpoint (required for Stage 1)
  steps: 50000
  lr: 0.001
  warmup_steps: 2000
  batch_size: 256
  scheduler: "cosine"
  weight_decay: 0.01
  eval_frequence: 10
  patience: 20

